# nginx.conf

events {
  # Add your event configuration here
}

http {

  # used for CSS
  include mime.types;

  # The scheme the client actually used. Behind a TLS proxy this server is
  # reached over plain http, but the MCP sidecar has to advertise https in its
  # OAuth metadata or clients reject the mismatch.
  map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  server {
    listen 80;

    server_name localhost;

    root /app/ui/public;

    location / {
      try_files $uri $uri/ =404;
    }

    location /page {
      alias /app/ui/public/page/;
      try_files $uri $uri/ /page/index.html;
    }

    location /ping {
      return 200;
    }

    # MCP sidecar. Exact match: the server answers /mcp and nothing below it.
    location = /mcp {
      proxy_pass http://127.0.0.1:9901;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Streamable HTTP keeps a POST response open for notifications, so
      # responses must not be buffered and the read timeout has to be generous.
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # One-time file links the MCP tools hand out. The body limit is above the
    # sidecar's own 25 MB so that it, not nginx's 1 MB default, is what answers
    # an oversized upload.
    location /mcp/files/ {
      proxy_pass http://127.0.0.1:9901;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      client_max_body_size 26m;
      proxy_request_buffering off;
    }

    location /oauth/ {
      proxy_pass http://127.0.0.1:9901;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Only the OAuth documents, so /.well-known/acme-challenge and anything
    # else served from the UI root keeps working.
    location /.well-known/oauth- {
      proxy_pass http://127.0.0.1:9901;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
